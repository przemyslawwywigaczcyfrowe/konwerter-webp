<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Konwerter na WebP</title>
<!--
  ╔══════════════════════════════════════════════════════════════╗
  ║  Konwerter na WebP v1.0                                      ║
  ║  Autor: Przemysław Wywigacz                                  ║
  ╚══════════════════════════════════════════════════════════════╝
-->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #0a0a0a;
    color: #e0e0e0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  h1 {
    font-size: 1.4rem;
    font-weight: 600;
    margin-bottom: 0.3rem;
    color: #fff;
  }
  .subtitle {
    font-size: 0.8rem;
    color: #666;
    margin-bottom: 1.5rem;
  }
  #drop-zone {
    width: min(500px, 90vw);
    border: 2px dashed #333;
    border-radius: 12px;
    padding: 3rem 2rem;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s;
  }
  #drop-zone.drag-over {
    border-color: #4f8cff;
    background: rgba(79, 140, 255, 0.05);
  }
  #drop-zone p {
    font-size: 0.95rem;
    color: #888;
    pointer-events: none;
  }
  #drop-zone .icon {
    font-size: 2.5rem;
    margin-bottom: 0.5rem;
    pointer-events: none;
    display: block;
  }
  #drop-zone .formats {
    font-size: 0.7rem;
    color: #555;
    margin-top: 0.6rem;
    pointer-events: none;
  }
  .controls {
    width: min(500px, 90vw);
    margin-top: 1rem;
    display: flex;
    align-items: center;
    gap: 0.8rem;
    font-size: 0.8rem;
    color: #888;
  }
  .controls label { white-space: nowrap; }
  .controls input[type="range"] {
    flex: 1;
    accent-color: #4f8cff;
  }
  .controls span {
    min-width: 2.5ch;
    text-align: right;
    font-variant-numeric: tabular-nums;
  }
  #status {
    margin-top: 1.2rem;
    font-size: 0.85rem;
    color: #4f8cff;
    min-height: 1.2em;
  }
  #file-input { display: none; }
</style>
</head>
<body>

<h1>Konwerter na WebP</h1>
<p class="subtitle">Wszystko działa lokalnie w przeglądarce</p>

<div id="drop-zone">
  <span class="icon">🖼️</span>
  <p>Upuść obrazki tutaj lub kliknij, aby wybrać</p>
  <p class="formats">JPG / JPEG / PNG / BMP / GIF / TIFF / AVIF / SVG / ICO / WEBP</p>
</div>

<div class="controls">
  <label for="quality">Jakość:</label>
  <input type="range" id="quality" min="1" max="100" value="80">
  <span id="quality-val">80%</span>
</div>

<p id="status"></p>
<input type="file" id="file-input" accept="image/*" multiple>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
const dropZone = document.getElementById('drop-zone');
const fileInput = document.getElementById('file-input');
const qualitySlider = document.getElementById('quality');
const qualityVal = document.getElementById('quality-val');
const status = document.getElementById('status');

qualitySlider.addEventListener('input', () => {
  qualityVal.textContent = qualitySlider.value + '%';
});

dropZone.addEventListener('click', () => fileInput.click());

dropZone.addEventListener('dragover', e => {
  e.preventDefault();
  dropZone.classList.add('drag-over');
});

dropZone.addEventListener('dragleave', () => {
  dropZone.classList.remove('drag-over');
});

dropZone.addEventListener('drop', e => {
  e.preventDefault();
  dropZone.classList.remove('drag-over');
  handleFiles(e.dataTransfer.files);
});

fileInput.addEventListener('change', () => {
  handleFiles(fileInput.files);
  fileInput.value = '';
});


function convertToWebP(file, quality) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      const canvas = document.createElement('canvas');
      canvas.width = img.naturalWidth;
      canvas.height = img.naturalHeight;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0);
      canvas.toBlob(
        blob => {
          URL.revokeObjectURL(url);
          if (blob) resolve(blob);
          else reject(new Error('Konwersja nie powiodła się: ' + file.name));
        },
        'image/webp',
        quality
      );
    };
    img.onerror = () => {
      URL.revokeObjectURL(url);
      reject(new Error('Nie udało się wczytać: ' + file.name));
    };
    img.src = url;
  });
}

function download(blob, filename) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

async function handleFiles(fileList) {
  const files = [...fileList].filter(f => f.type.startsWith('image/'));
  if (!files.length) {
    status.textContent = 'Brak obsługiwanych plików graficznych.';
    return;
  }

  const quality = qualitySlider.value / 100;

  if (files.length === 1) {
    status.textContent = 'Konwertuję...';
    try {
      const blob = await convertToWebP(files[0], quality);
      download(blob, files[0].name + '.webp');
      status.textContent = 'Gotowe! Plik pobrany.';
    } catch (e) {
      status.textContent = e.message;
    }
    return;
  }

  // Wiele plików → ZIP
  status.textContent = `Konwertuję 0/${files.length}...`;
  const zip = new JSZip();
  let done = 0;
  let errors = 0;

  for (const file of files) {
    try {
      const blob = await convertToWebP(file, quality);
      zip.file(file.name + '.webp', blob);
    } catch {
      errors++;
    }
    done++;
    status.textContent = `Konwertuję ${done}/${files.length}...`;
  }

  if (done - errors === 0) {
    status.textContent = 'Żaden plik nie został skonwertowany.';
    return;
  }

  status.textContent = 'Pakuję ZIP...';
  const zipBlob = await zip.generateAsync({ type: 'blob' });
  download(zipBlob, 'webp-obrazki.zip');
  const msg = `Gotowe! Pobrano ZIP (${done - errors} plików).`;
  status.textContent = errors ? msg + ` ${errors} błędów.` : msg;
}
</script>
</body>
</html>
